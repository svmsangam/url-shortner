<svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="240" fill="#FFFFFF"/>

  <!-- Icon group: chain link + lightning bolt -->
  <g transform="translate(60,40)">
    <!-- Chain link (outer ring) -->
    <path d="M 40 80
             a 40 40 0 1 1 56.6 56.6
             l -18 18
             a 15 15 0 0 1 -21.2 -21.2
             l 18 -18
             a 14 14 0 0 0 -19.8 -19.8
             l -30 30
             a 14 14 0 0 0 19.8 19.8
             l 6 -6
             a 15 15 0 0 1 21.2 21.2
             l -6 6
             a 40 40 0 1 1 -56.6 -56.6
             z"
          fill="#1E293B"/>

    <!-- Lightning bolt (accent, overlapping the link) -->
    <path d="M 108 40
             L 66 106
             L 92 106
             L 78 160
             L 130 92
             L 102 92
             Z"
          fill="#2563EB"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700"
        font-size="72"
        letter-spacing="-1"
        fill="#1E293B">Short<tspan fill="#2563EB">IT</tspan></text>
</svg>
